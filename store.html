<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #f0f0f0; min-height: 100vh; }

    #store-header {
      display: flex; align-items: center; gap: 14px;
      padding: 20px 32px; border-bottom: 1px solid #1f1f1f;
      background: #111;
    }
    #store-logo { height: 40px; width: auto; }
    #store-name { font-size: 1.3rem; font-weight: 700; }

    #store-main { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }

    #products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #141414; border: 1px solid #1f1f1f; border-radius: 14px;
      overflow: hidden; transition: transform .2s, border-color .2s;
    }
    .product-card:hover { transform: translateY(-3px); border-color: #333; }
    .product-card img { width: 100%; height: 180px; object-fit: cover; background: #1a1a1a; }
    .product-card .no-img {
      width: 100%; height: 180px; background: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; color: #333;
    }
    .product-info { padding: 14px; }
    .product-info h3 { font-size: .95rem; font-weight: 600; margin-bottom: 6px; }
    .product-info .price { font-size: 1.1rem; font-weight: 700; color: #c6f135; }
    .product-info .stock { font-size: .78rem; color: #666; margin-top: 4px; }
    .btn-buy {
      display: block; width: 100%; margin-top: 12px;
      padding: 10px; border: none; border-radius: 8px;
      background: #c6f135; color: #0a0a0a; font-weight: 700;
      font-size: .88rem; cursor: pointer; transition: opacity .15s;
    }
    .btn-buy:hover { opacity: .85; }

    #store-empty {
      text-align: center; padding: 80px 20px; color: #444; font-size: 1.1rem;
    }
    #store-loading { text-align: center; padding: 80px 20px; color: #444; }
    #store-error { text-align: center; padding: 80px 20px; color: #c44; }
  </style>
</head>
<body>

<header id="store-header">
  <img id="store-logo" src="" alt="" hidden>
  <span id="store-name">Cargando...</span>
</header>

<main id="store-main">
  <div id="store-loading">Cargando tienda...</div>
  <div id="store-error" hidden>Esta tienda no existe o no está disponible.</div>
  <div id="products-grid" hidden></div>
  <div id="store-empty" hidden>Esta tienda todavía no tiene productos.</div>
</main>

<script>
const API_URL = 'https://hash-cloud-production.up.railway.app';

async function loadStore() {
  // Leer slug del subdominio
  const host = window.location.hostname; // ej: mitienda.hashcommerce.site
  const parts = host.split('.');
  const slug = parts.length >= 3 ? parts[0] : null;

  if (!slug || slug === 'www') {
    showError();
    return;
  }

  try {
    const res = await fetch(`${API_URL}/commerce/public/${slug}`);
    if (!res.ok) { showError(); return; }
    const data = await res.json();
    renderStore(data);
  } catch {
    showError();
  }
}

function renderStore(data) {
  document.title = data.store_name;
  document.getElementById('store-name').textContent = data.store_name;

  if (data.logo_url) {
    const logo = document.getElementById('store-logo');
    logo.src = data.logo_url;
    logo.removeAttribute('hidden');
  }

  if (data.primary_color) {
    document.querySelectorAll('.price, .btn-buy').forEach(el => {
      if (el.classList.contains('btn-buy')) el.style.background = data.primary_color;
      else el.style.color = data.primary_color;
    });
  }

  document.getElementById('store-loading').setAttribute('hidden', '');

  if (!data.products.length) {
    document.getElementById('store-empty').removeAttribute('hidden');
    return;
  }

  const grid = document.getElementById('products-grid');
  grid.innerHTML = data.products.map(p => `
    <div class="product-card">
      ${p.image_url
        ? `<img src="${p.image_url}" alt="${escHtml(p.name)}">`
        : `<div class="no-img">◻</div>`}
      <div class="product-info">
        <h3>${escHtml(p.name)}</h3>
        <div class="price">$${Number(p.price).toLocaleString('es-AR')}</div>
        ${p.stock != null ? `<div class="stock">${p.stock > 0 ? p.stock + ' disponibles' : 'Sin stock'}</div>` : ''}
        <button class="btn-buy" ${p.stock === 0 ? 'disabled' : ''}>
          ${p.stock === 0 ? 'Sin stock' : 'Comprar'}
        </button>
      </div>
    </div>
  `).join('');
  grid.removeAttribute('hidden');
}

function showError() {
  document.getElementById('store-loading').setAttribute('hidden', '');
  document.getElementById('store-error').removeAttribute('hidden');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadStore();
</script>
</body>
</html>
